name: Vendor Gateway Tabler CSS
"on":
  push:
    branches:
      - feat/tabler-gateway-ui
    paths:
      - .github/workflows/vendor-tabler.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Extract pinned official Tabler package
        run: |
          set -euo pipefail
          mkdir -p public/assets/vendor
          directory="$(mktemp -d)"
          npm pack @tabler/core@1.6.1 --pack-destination "$directory" --ignore-scripts --silent
          tar -xOf "$directory/tabler-core-1.6.1.tgz" package/dist/css/tabler.min.css > public/assets/vendor/tabler.min.css
          test -s public/assets/vendor/tabler.min.css
          grep -q -- '--tblr-' public/assets/vendor/tabler.min.css
          printf '%s\n' "Vendored CSS bytes: $(wc -c < public/assets/vendor/tabler.min.css)"
      - name: Commit CSS to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vendor/tabler.min.css
          if ! git diff --cached --quiet; then
            git commit -m "vendor: pin Gateway Tabler UI CSS 1.6.1"
            git push origin HEAD:feat/tabler-gateway-ui
          fi
